<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الفرقان - حصن المسلم والأذكار</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/icons.css" />
    
    <link rel="stylesheet" href="/variables.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/adkar/style.css" />
</head>
<body>

    <!-- ===== الشريط العلوي الموحد ===== -->
    <header class="main-header" id="mainHeader">
        <div class="header-content">
            <a href="/index.html" class="back-btn" id="headerBackBtn" aria-label="الرجوع للرئيسية" title="الرجوع للرئيسية">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="header-title">
                <h1><i class="fa-solid fa-hands-praying"></i> الأذكار والأدعية</h1>
            </div>
            <div class="header-actions">
                <a href="/index.html" class="back-btn" title="الرئيسية" aria-label="الرئيسية">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- ===== المحتوى ===== -->
    <main class="main-content">
        
        <!-- شريط البحث عن الأذكار -->
        <div class="search-section" id="adkarSearchSection" style="display: none;">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="adkarSearchInput" placeholder="ابحث في الأذكار والتصنيفات (مثال: الصباح، المساء، النوم، الاستغفار)..." autocomplete="off" />
                <button class="search-clear" id="adkarSearchClear" aria-label="مسح البحث" style="display:none;">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
        </div>

        <!-- حالة التحميل -->
        <div class="loading-state" id="loadingState">
            <i class="fa-solid fa-spinner spin"></i>
            <span>جاري تحميل الأذكار...</span>
        </div>

        <!-- 1) واجهة المجموعات -->
        <div id="categoriesView" style="display: none;">
            <div class="section-label" id="categoriesSectionLabel">مجموعات الأذكار اليومية</div>
            <div class="categories-grid" id="categoriesGrid"></div>
            <div class="no-results" id="adkarNoResults" style="display:none;">
                <i class="fa-solid fa-magnifying-glass no-results-icon"></i>
                <p class="no-results-text">لا توجد نتائج مطابقة للبحث</p>
                <button class="no-results-btn" id="clearAdkarSearchBtn">عرض جميع الأذكار</button>
            </div>
        </div>

        <!-- 2) واجهة تفاصيل الأذكار للمجموعة المحددة -->
        <div id="detailView" style="display: none;">
            <div class="detail-header-card">
                <button class="back-to-categories-btn" id="backToCategoriesBtn">
                    <i class="fa-solid fa-arrow-right"></i> العودة للمجموعات
                </button>
                <h2 id="activeCategoryTitle" class="active-category-title">--</h2>
            </div>
            <div class="azkar-list" id="azkarList"></div>
        </div>

    </main>

    <!-- توست الإشعارات -->
    <div class="toast-msg" id="toastMsg">تم النسخ بنجاح</div>

    <script src="/praytime.js"></script>
    <script src="/settings.js"></script>
    <script src="/android-bridge.js"></script>
    <script src="/global-audio.js"></script>
    <script src="/adkar/main.js"></script>
</body>
</html>
