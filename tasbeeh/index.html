<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('✅ Service Worker registered successfully:', reg.scope);
                    
                    // Check for updates
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('🔄 New Service Worker update found. Activating immediately...');
                                newWorker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                }).catch(err => {
                    console.error('❌ Service Worker registration failed:', err);
                });
            });

            // Reload page once when the new controller takes over to reflect updates instantly
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    console.log('🔄 Service Worker updated. Reloading page...');
                    window.location.reload();
                }
            });
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الفرقان - المسبحة الإلكترونية</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css?v=5" />
    <link rel="stylesheet" href="/icons.css?v=5" />
    <!-- المتغيرات الشاملة (الألوان، الثيمات، الخطوط) -->
    <link rel="stylesheet" href="/variables.css?v=5" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/tasbeeh/style.css?v=5" />
    <!-- منع تكبير الشاشة في iOS واللمس المتعدد غير المقصود -->
    <style>
        * { touch-action: manipulation; }
    </style>
</head>
<body class="theme-default">
    <div class="app-container">
        <!-- ========================================= -->
        <!-- شريط الرأس الموحد (Header)                 -->
        <!-- ========================================= -->
        <header class="main-header" id="mainHeader">
            <div class="header-content">
                <a href="/index.html" class="back-btn" id="headerBackBtn" aria-label="الرجوع للرئيسية" title="الرجوع للرئيسية">
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
                <div class="header-title">
                    <h1><i class="fa-solid fa-calculator"></i> المسبحة الإلكترونية</h1>
                </div>
                <div class="header-actions">
                    <a href="/index.html" class="back-btn" title="الرئيسية" aria-label="الرئيسية">
                        <i class="fa-solid fa-house"></i>
                    </a>
                </div>
            </div>
        </header>

        <!-- ========================================= -->
        <!-- المحتوى الرئيسي للمسبحة (تصميم مسبحتي)        -->
        <!-- ========================================= -->
        <main class="tasbeeh-main-content">
            <div class="tasbeeh-page-wrapper">
                
                <!-- 1. لوحة الذكر الفعّال الحالي (Current Active Dhikr) -->
                <div class="active-dhikr-display-card" id="activeDhikrCard">
                    <p class="current-label">الذكر الحالي</p>
                    <h2 class="current-dhikr-text" id="tasbeehPhraseDisplayText">سبحان الله</h2>
                </div>

                <!-- 2. زر العداد الدائري العملاق (The Giant Circular Counter Clicker) -->
                <div class="giant-counter-wrapper">
                    <button class="giant-click-circle" id="masbahatiClicker" aria-label="اضغط للتسبيح">
                        <!-- حلقة التقدم الدائرية SVG المحيطة بالدائرة بالكامل -->
                        <svg class="progress-ring-svg" viewBox="0 0 240 240">
                            <!-- الحلقة الخلفية الخافتة -->
                            <circle class="progress-ring-track" cx="120" cy="120" r="110" />
                            <!-- حلقة التقدم النشطة المتوهجة -->
                            <circle class="progress-ring-fill" id="progressRingFill" cx="120" cy="120" r="110" />
                        </svg>
                        
                        <!-- المحتوى الرقمي بداخل الدائرة العملاقة -->
                        <div class="inner-clicker-content">
                            <span class="count-number" id="tasbeehCountDisplay">0</span>
                            <span class="tap-hint-text" id="clickerHintLabel">اضغط للتسبيح</span>
                        </div>
                    </button>
                </div>

                <!-- 3. شريط التحكم المدمج والخيارات السريعة (Quick Settings Row) -->
                <div class="compact-controls-row">
                    <!-- زر تصفير العداد الحالي -->
                    <button class="control-round-btn" id="tasbeehResetBtn" title="تصفير العداد" aria-label="تصفير العداد">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>تصفير</span>
                    </button>

                    <!-- عداد الدورات الإجمالي للذكر الحالي -->
                    <div class="stat-pill-badge">
                        <span class="badge-label">الدورات:</span>
                        <span class="badge-val" id="tasbeehRounds">0</span>
                    </div>

                    <!-- ميزة اختيار الهدف النشط السريع (33، 100، مفتوح) عند النقر -->
                    <button class="control-round-btn clickable" id="cycleTargetBtn" title="تغيير الهدف السريع">
                        <i class="fa-solid fa-bullseye"></i>
                        <span id="tasbeehTargetDisplay">الهدف: 33</span>
                    </button>

                    <!-- خيار كتم الصوت والاهتزاز التفاعلي -->
                    <button class="control-round-btn" id="toggleFeedbackBtn" title="كتم/تفعيل التفاعل">
                        <i class="fa-solid fa-volume-high" id="feedbackIcon"></i>
                        <span id="feedbackLabel">تفاعل</span>
                    </button>
                </div>

                <!-- 4. قائمة اختيار الأذكار وإدارة الكتالوج (Dhikr Management Grid) -->
                <div class="dhikr-selection-card">
                    <div class="selection-card-header">
                        <h3>قائمة الأذكار والتسابيح</h3>
                        <button class="add-custom-dhikr-btn" id="toggleAddFormBtn" aria-label="إضافة ذكر مخصص">
                            <i class="fa-solid fa-plus"></i>
                            <span>إضافة ذكر</span>
                        </button>
                    </div>

                    <!-- نموذج إضافة ذكر جديد منبثق مدمج ومصمم برقي -->
                    <div class="add-dhikr-slide-form" id="addDhikrForm">
                        <div class="form-inputs-row">
                            <div class="form-input-box">
                                <label for="newDhikrText">الذكر المقترح:</label>
                                <input type="text" id="newDhikrText" placeholder="اكتب الذكر هنا..." maxlength="60" />
                            </div>
                            <div class="form-input-box short">
                                <label for="newDhikrTarget">الهدف:</label>
                                <input type="number" id="newDhikrTarget" value="33" min="1" max="9999" />
                            </div>
                        </div>
                        <button class="submit-new-dhikr-btn" id="btnSubmitDhikr">
                            <i class="fa-solid fa-check"></i>
                            <span>حفظ الذكر وإضافته</span>
                        </button>
                    </div>

                    <!-- قائمة الأذكار الكلية -->
                    <div class="dhikr-catalog-grid" id="dhikrCatalogList">
                        <!-- يتم إنشاؤها عبر JavaScript ديناميكياً -->
                    </div>
                </div>

            </div>
        </main>

        <!-- نافذة تأكيد التصفير المنبثقة الراقية -->
        <div class="modal-overlay" id="tasbeehResetModal">
            <div class="modal-content">
                <div class="modal-alert-icon">
                    <i class="fa-solid fa-rotate-left"></i>
                </div>
                <h3>تصفير العداد</h3>
                <p>هل أنت متأكد من رغبتك في تصفير العداد وإعادة ضبط عدد الدورات للذكر الحالي بالكامل؟</p>
                <div class="modal-buttons-grid">
                    <button id="confirmResetBtn" class="modal-btn-confirm">تصفير الآن</button>
                    <button id="cancelResetBtn" class="modal-btn-cancel">تراجع</button>
                </div>
            </div>
        </div>

    </div>
    
    <!-- السكريبتات -->
    <script src="/android-bridge.js?v=5"></script>
    <script src="/settings.js?v=5"></script>
    <script src="/global-audio.js?v=5"></script>
    <script src="/tasbeeh/main.js?v=5"></script>
</body>
</html>
