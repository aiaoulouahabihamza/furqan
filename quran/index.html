<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الفرقان - المصحف الشريف</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/icons.css" />
    <link rel="stylesheet" href="/variables.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/quran/style.css" />
</head>
<body>

    <header class="main-header" id="mainHeader">
        <div class="header-content">
            <a href="/index.html" class="back-btn" id="headerBackBtn" aria-label="الرجوع للرئيسية" title="الرجوع للرئيسية">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="header-title">
                <h1>
                    <span class="header-icon">
                        <i class="fa-solid fa-book-open"></i>
                    </span>
                    <span class="header-text">القرآن الكريم</span>
                </h1>
            </div>
            <div class="header-actions">
                <button class="header-btn" id="headerBookmarksBtn" title="المرجعيات والعلامات المحفوظة">
                    <i class="fa-solid fa-book-bookmark"></i>
                </button>
                <a href="/index.html" class="back-btn" title="الرئيسية" aria-label="الرئيسية">
                    <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="search-section">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن سورة..." autocomplete="off" />
                <button class="search-clear" id="searchClear" aria-label="مسح البحث">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
        </div>

        <!-- أزرار الوصول السريع لآخر قراءة والمرجعيات -->
        <div class="quran-quick-actions" style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button id="lastReadBtn" class="quick-action-pill" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full, 9999px); color: var(--color-primary); font-size: 13px; font-weight: 700; cursor: pointer; transition: var(--transition);">
                <i class="fa-regular fa-bookmark"></i>
                <span>متابعة آخر قراءة</span>
            </button>
            <button id="bookmarksBtn" class="quick-action-pill" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full, 9999px); color: var(--color-text); font-size: 13px; font-weight: 700; cursor: pointer; transition: var(--transition);">
                <i class="fa-solid fa-book-bookmark"></i>
                <span>المرجعيات</span>
            </button>
        </div>

        <div class="riwayah-note" id="statsBar">
            <i class="fa-solid fa-feather-pointed"></i>
            <span>القرآن الكريم برواية ورش عن نافع — الرسم والضبط المغربي</span>
        </div>

        <a href="/recitations/index.html" class="recitations-banner-link" style="display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, rgba(16, 130, 141, 0.15), rgba(18, 85, 123, 0.1)); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; text-decoration: none; color: var(--color-primary-dark); font-weight: 700; font-size: 13px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-headphones" style="font-size: 18px; color: var(--color-primary);"></i>
                <span>قسم التلاوات: استمع للقرآن بصوت مشاري العفاسي، عبد الباسط، والمنشاوي...</span>
            </div>
            <i class="fa-solid fa-chevron-left" style="font-size: 12px; color: var(--color-primary);"></i>
        </a>

        <div class="loading-state" id="loadingState">
            <div class="loading-spinner">
                <i class="fa-solid fa-spinner spin"></i>
            </div>
            <span class="loading-text">جاري تحميل القرآن...</span>
        </div>

        <div class="surah-list" id="surahList"></div>

        <div class="no-results" id="noResults" style="display:none;">
            <i class="fa-solid fa-magnifying-glass no-results-icon"></i>
            <p class="no-results-text">لا توجد نتائج للبحث</p>
            <button class="no-results-btn" id="clearSearchBtn">عرض جميع السور</button>
        </div>
    </main>

    <!-- مودال العلامات المرجعية -->
    <div class="modal-overlay" id="bookmarksModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fa-solid fa-book-bookmark"></i> العلامات المرجعية بالسور</h2>
                <button class="modal-close" id="closeBookmarksBtn" aria-label="إغلاق">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="bookmarks-body" id="bookmarksList">
                <!-- سيتم تعبئتها عبر الجافا سكريبت -->
            </div>
        </div>
    </div>

    <script src="/praytime.js"></script>
    <script src="/settings.js"></script>
    <script src="/android-bridge.js"></script>
    <script src="/global-audio.js"></script>
    <script src="/quran/main.js"></script>
</body>
</html>
