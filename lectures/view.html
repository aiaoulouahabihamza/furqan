<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('✅ Service Worker registered successfully:', reg.scope);
                }).catch(err => {
                    console.error('❌ Service Worker registration failed:', err);
                });
            });
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>الفرقان - مشغل الصوتيات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css?v=5" />
    <link rel="stylesheet" href="/icons.css?v=5" />
    <link rel="stylesheet" href="/variables.css?v=5" />
    <link rel="stylesheet" href="/style.css?v=5" />
    <link rel="stylesheet" href="/auth.css?v=5" />
    
    <style>
        :root {
            --color-primary: #3A9B99;
            --color-primary-dark: #2D7A78;
            --color-bg-dark: #121A1E;
            --color-card-dark: #1A262C;
            --color-border-dark: #26353F;
            --color-text-light: #E2E8F0;
        }

        body {
            background-color: #F8FAFB;
            font-family: 'Cairo', sans-serif;
            color: #2D3748;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            padding-top: var(--header-height, 56px);
            padding-bottom: 140px; /* مساحة واسعة ومريحة لعدم حجب محتوى القائمة بواسطة المشغل السفلي */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* رأس الصفحة الموحد */
        .main-header {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: var(--glass-bg, rgba(255, 255, 255, 0.9));
            backdrop-filter: var(--glass-blur, blur(10px));
            -webkit-backdrop-filter: var(--glass-blur, blur(10px));
            border-bottom: 1px solid var(--color-border, #E2E8F0);
            height: var(--header-height, 56px);
            display: flex;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 2px 10px rgba(18, 85, 123, 0.06);
        }

        .header-content {
            max-width: var(--max-width, 1200px);
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            box-sizing: border-box;
        }

        .header-title {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 0 10px;
        }

        .header-title h1 {
            font-size: 15px;
            font-weight: 800;
            color: var(--color-primary, #3A9B99);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            min-width: 36px;
            flex-shrink: 0;
        }

        /* حاوية العرض العلوية المنظمة والمفتوحة */
        .viewer-container {
            max-width: 960px;
            width: 100%;
            margin: 20px auto;
            padding: 0 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        /* بطاقة تفاصيل المادة والمحاضرة */
        .detail-card {
            background: #FFFFFF;
            border-radius: 18px;
            border: 1px solid #E2E8F0;
            padding: 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease;
        }

        .lecture-title-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 18px;
        }

        .lecture-header-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3A9B99 0%, #1A2D35 100%);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(58, 155, 153, 0.25);
        }

        .lecture-header-text {
            flex: 1;
            min-width: 0;
        }

        .lecture-header-text h2 {
            font-size: 18px;
            font-weight: 800;
            color: #1A202C;
            margin: 0 0 6px 0;
            line-height: 1.4;
        }

        .lecture-header-text .scholar-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-primary, #3A9B99);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #1A202C;
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #E6FFFA;
            padding-bottom: 8px;
        }

        .section-title .title-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #3A9B99;
        }

        .section-title .count-badge {
            background: #EBF8F8;
            color: #3A9B99;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* شبكة بيانات التعريف - فقط صاحب المادة وعدد الأجزاء */
        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 640px) {
            .meta-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #F8FAFC;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #E2E8F0;
            transition: all 0.2s ease;
        }

        .meta-item:hover {
            border-color: #CBD5E0;
            background: #F1F5F9;
        }

        .meta-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #EBF8F8 0%, #D3F3F1 100%);
            color: #2F7E7C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(47, 126, 124, 0.1);
        }

        .meta-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 2px;
        }

        .meta-label {
            font-size: 11.5px;
            color: #718096;
            font-weight: 700;
            white-space: nowrap;
        }

        .meta-value {
            font-size: 14px;
            color: #1A202C;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .description-box {
            font-size: 13.5px;
            color: #4A5568;
            line-height: 1.8;
            text-align: justify;
            background: #F8FAFC;
            border: 1px solid #EDF2F7;
            padding: 16px 18px;
            border-radius: 14px;
            margin: 0;
        }

        /* قائمة الأجزاء والمستندات الصوتية */
        .parts-container-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .part-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 14px;
            padding: 12px 16px;
            transition: all 0.2s ease;
            gap: 12px;
        }

        .part-row:hover {
            border-color: #3A9B99;
            box-shadow: 0 4px 14px rgba(58, 155, 153, 0.08);
            transform: translateY(-1px);
        }

        .part-row.playing {
            border-color: #3A9B99;
            background: #F0FAF9;
            box-shadow: 0 4px 16px rgba(58, 155, 153, 0.12);
        }

        .part-info-block {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .part-row-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #EDF2F7;
            color: #718096;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .part-row.playing .part-row-icon {
            background: #3A9B99;
            color: #FFFFFF;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(58, 155, 153, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(58, 155, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(58, 155, 153, 0); }
        }

        .part-text-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .part-row-title {
            font-size: 14px;
            font-weight: 700;
            color: #2D3748;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .part-row.playing .part-row-title {
            color: #1F6B6A;
        }

        .part-row-subtitle {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .part-row-meta {
            font-size: 11.5px;
            color: #A0AEC0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .part-actions-block {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            color: #4A5568;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .action-circle-btn:hover {
            border-color: #3A9B99;
            color: #3A9B99;
            background: #EBF8F8;
            transform: scale(1.08);
        }

        .action-circle-btn.play-trigger.active-play {
            background: #3A9B99;
            color: #FFFFFF;
            border-color: #3A9B99;
        }

        /* =======================================================
           المشغل الصوتي الأنيق (Warm Light Rounded Audio Island)
           ======================================================= */
        .bottom-fixed-player {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: min(880px, calc(100% - 24px));
            z-index: 1000;
            background: linear-gradient(180deg, #FCFBF9 0%, #F6F1EA 100%);
            border: 1.5px solid #E6DCCD;
            box-shadow: 0 16px 40px rgba(92, 70, 44, 0.12), 0 2px 10px rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            box-sizing: border-box;
            color: #2D241E;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: player-entrance 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 14px 20px 14px;
            gap: 10px;
        }

        @keyframes player-entrance {
            from { opacity: 0; transform: translate(-50%, 25px) scale(0.98); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        /* الصف العلوي: عنوان المقطع والمحاضر وأدوات التنزيل والصوت */
        .player-top-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .player-title-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .player-audio-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #EFE8DC;
            color: #3A9B99;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            border: 1px solid #E2D7C7;
        }

        .player-text-group {
            display: flex;
            flex-direction: column;
            min-width: 0;
            gap: 2px;
        }

        .track-main-title {
            font-size: 14px;
            font-weight: 800;
            color: #2C241D;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
            line-height: 1.3;
        }

        .track-sub-details {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: #796654;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .scholar-name-tag {
            font-weight: 600;
            color: #5C4D3C;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .part-number-badge {
            background: #EAE2D5;
            color: #3A9B99;
            border: 1px solid #DFD5C4;
            font-size: 10.5px;
            padding: 1px 7px;
            border-radius: 6px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .player-top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .warm-action-btn {
            background: #FAF7F2;
            border: 1px solid #E0D4C3;
            color: #5C4D3C;
            padding: 5px 11px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .warm-action-btn:hover {
            background: #3A9B99;
            border-color: #3A9B99;
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .warm-volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #FAF7F2;
            padding: 4px 8px;
            border-radius: 9px;
            border: 1px solid #E0D4C3;
        }

        .warm-vol-btn {
            background: none;
            border: none;
            color: #796654;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .warm-vol-btn:hover {
            color: #3A9B99;
        }

        .warm-vol-slider {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #DFD5C4;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .warm-vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3A9B99;
            cursor: pointer;
        }

        /* الصف الأوسط: أزرار التحكم في الوسط مع زر التشغيل والإيقاف الكبير */
        .player-center-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            margin: 2px 0;
        }

        .warm-ctrl-btn {
            background: #FAF7F2;
            border: 1px solid #E0D4C3;
            color: #5C4D3C;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .warm-ctrl-btn:hover {
            color: #2C241D;
            background: #EFE8DC;
            border-color: #D2C4B1;
            transform: scale(1.08);
        }

        .warm-ctrl-btn.seek-btn {
            font-size: 13px;
        }

        .warm-ctrl-btn .seek-label {
            position: absolute;
            font-size: 8px;
            font-weight: 800;
            bottom: 6px;
            color: #3A9B99;
        }

        .warm-ctrl-btn.master-play-btn {
            background: linear-gradient(135deg, #3A9B99 0%, #247573 100%);
            color: #FFFFFF;
            font-size: 19px;
            width: 48px;
            height: 48px;
            box-shadow: 0 4px 14px rgba(58, 155, 153, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .warm-ctrl-btn.master-play-btn:hover {
            background: linear-gradient(135deg, #44ABA9 0%, #2A8987 100%);
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(58, 155, 153, 0.55);
        }

        /* الصف السفلي: الأعمدة العشرة المتحركة وشريط التتبع الممتد */
        .player-bottom-visual-progress {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 6px;
        }

        /* 10 أعمدة 5px تصعد وتنزل عشوائياً عند التشغيل */
        .ten-columns-equalizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 18px;
        }

        .ten-columns-equalizer .eq-col {
            width: 5px;
            height: 4px;
            background: #3A9B99;
            border-radius: 3px;
            transition: height 0.15s ease;
        }

        .ten-columns-equalizer.active .eq-col:nth-child(1) { animation: eq-anim-1 0.65s ease-in-out infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(2) { animation: eq-anim-2 0.5s ease-in-out 0.1s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(3) { animation: eq-anim-3 0.8s ease-in-out 0.2s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(4) { animation: eq-anim-4 0.6s ease-in-out 0.05s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(5) { animation: eq-anim-5 0.75s ease-in-out 0.3s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(6) { animation: eq-anim-3 0.55s ease-in-out 0.15s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(7) { animation: eq-anim-1 0.7s ease-in-out 0.25s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(8) { animation: eq-anim-4 0.52s ease-in-out 0.1s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(9) { animation: eq-anim-2 0.85s ease-in-out 0.2s infinite alternate; }
        .ten-columns-equalizer.active .eq-col:nth-child(10) { animation: eq-anim-5 0.6s ease-in-out 0.35s infinite alternate; }

        @keyframes eq-anim-1 { 0% { height: 3px; } 100% { height: 16px; } }
        @keyframes eq-anim-2 { 0% { height: 4px; } 100% { height: 18px; } }
        @keyframes eq-anim-3 { 0% { height: 3px; } 100% { height: 14px; } }
        @keyframes eq-anim-4 { 0% { height: 5px; } 100% { height: 17px; } }
        @keyframes eq-anim-5 { 0% { height: 3px; } 100% { height: 15px; } }

        /* خط طويل للتتبع من 0:00 إلى النهاية */
        .player-progress-bar-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-time-display {
            font-size: 11.5px;
            font-weight: 700;
            color: #796654;
            min-width: 38px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-family: inherit;
        }

        .player-slider-track-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            height: 18px;
        }

        .warm-range-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #DFD5C4;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            direction: rtl;
            transition: all 0.15s ease;
        }

        .warm-range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #3A9B99;
            cursor: pointer;
            box-shadow: 0 1px 6px rgba(58, 155, 153, 0.5);
            border: 2px solid #FFFFFF;
            transition: transform 0.15s ease;
        }

        .warm-range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #247573;
        }

        /* لودر التحميل والانتظار */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            gap: 16px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(58, 155, 153, 0.15);
            border-left-color: #3A9B99;
            border-radius: 50%;
            animation: spin-loader 1s linear infinite;
        }

        @keyframes spin-loader {
            to { transform: rotate(360deg); }
        }

        /* التجاوب والتكيف مع الشاشات المختلفة */
        @media (max-width: 768px) {
            .bottom-fixed-player {
                bottom: 10px;
                width: calc(100% - 16px);
                border-radius: 20px;
                padding: 12px 14px 12px;
                gap: 8px;
            }

            .warm-volume-box {
                display: none;
            }

            .warm-action-btn .btn-caption {
                display: none;
            }

            .warm-action-btn {
                padding: 5px 8px;
            }

            .track-main-title {
                font-size: 13px;
                max-width: 170px;
            }

<body>

    <!-- ===== الشريط العلوي الموحد ===== -->

                <div class="eq-col"></div>
                <div class="eq-col"></div>

            <!-- خط طويل للتتبع مع شريط التقدم والتوقيت -->

    <!-- جسر الأندرويد ومكتبة التنبيهات -->
    <script src="/android-bridge.js?v=5"></script>
    <script src="/toast.js?v=5"></script>
    
    <!-- كود المشغل الاحترافي -->
    <script type="module">
        let activeLecture = null;
        let activeParts = [];
        let activeIndex = 0;
        let isPlaying = false;
        
        const audioContext = new Audio();
        
        // جلب معرف المحاضرة من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const lectureId = urlParams.get('id');

        function startViewInit() {
            const headerBackBtn = document.getElementById('headerBackBtn');
            if (headerBackBtn) {
                headerBackBtn.addEventListener('click', (e) => {
                    if (window.history.length > 1) {
                        e.preventDefault();
                        window.history.back();
                    }
                });
            }

            if (!lectureId) {
                showToast('خطأ: لم يتم تحديد المحاضرة المطلوبة', 'danger');
                setTimeout(() => window.location.href = './index.html', 2000);
                return;
            }

            // تحقق من الكاش للعرض الفوري
            const cached = sessionStorage.getItem('current_view_lecture');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed && String(parsed.id) === String(lectureId)) {
                        activeLecture = parsed;
                        activeParts = parsed.parts || [];
                        renderFullViewer();
                        return;
                    }
                } catch (e) {
                    console.error('Error reading cached lecture:', e);
                }
            }

            loadLectureFullDetails(lectureId);
        }

        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', startViewInit);
        } else {
            startViewInit();
        }

        // جلب البيانات من IslamHouse مع دعم البروكسي
        async function loadLectureFullDetails(id) {
            try {
                let rawItem = null;
                // 1. محاولة مباشرة
                try {
                    const response = await fetch(`https://api3.islamhouse.com/v3/paV29H2gm56kvLPy/main/get-item/${id}/ar/json`);
                    if (response.ok) rawItem = await response.json();
                } catch (e) {
                    console.log('Direct API failed, falling back to server proxy...');
                }

                // 2. محاولة عبر البروكسي
                if (!rawItem) {
                    const proxyRes = await fetch(`/api/islamhouse-item?id=${id}`);
                    if (proxyRes.ok) rawItem = await proxyRes.json();
                }

                if (!rawItem) throw new Error('فشل جلب تفاصيل المادة الصوتية');
                
                // تنسيق البيانات
                const scholar = (rawItem.prepared_by && rawItem.prepared_by.length > 0)
                    ? rawItem.prepared_by[0].title
                    : 'الشيخ / الداعية';

                let parts = [];
                if (rawItem.attachments && rawItem.attachments.length > 0) {
                    rawItem.attachments.forEach(att => {
                        const urlLower = (att.url || '').toLowerCase();
                        const extLower = (att.extension_type || '').toLowerCase();
                        if (att.url && (urlLower.endsWith('.mp3') || urlLower.endsWith('.m4a') || extLower === 'mp3')) {
                            let rawTitle = att.description || (att.url ? att.url.split('/').pop().replace('.mp3', '') : 'جزء غير معنون');
                            let title = rawTitle;
                            let subtitle = '';
                            if (rawTitle.includes(' - ')) {
                                const splitted = rawTitle.split(' - ');
                                title = splitted[0].trim();
                                subtitle = splitted.slice(1).join(' - ').trim();
                            }
                            parts.push({
                                title: title,
                                subtitle: subtitle,
                                url: att.url,
                                size: att.size || 'غير معروف'
                            });
                        }
                    });
                }

                activeLecture = {
                    id: rawItem.id,
                    title: rawItem.title,
                    scholar: scholar,
                    description: rawItem.full_description || rawItem.description || 'محاضرة وخطبة إسلامية قيمة تتناول جوانب الإيمان والشريعة المطهرة.',
                    parts: parts,
                    importance: rawItem.importance_level || 'عام',
                    image: rawItem.image,
                    addDate: rawItem.add_date ? new Date(rawItem.add_date * 1000).toLocaleDateString('ar-SA') : 'غير متوفر'
                };
                
                activeParts = parts;
                renderFullViewer();
            } catch (err) {
                console.error(err);
                const container = document.getElementById('mainViewerContent');
                if (container) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; color: #4A5568;">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #E53E3E; margin-bottom: 16px;"></i>
                            <h3 style="font-size: 16px; font-weight: 700;">تعذر تحميل تفاصيل المادة الصوتية</h3>
                            <p style="font-size: 13px; color: #718096; margin-top: 8px;">يرجى التأكد من اتصال الإنترنت ثم المحاولة ثانية</p>
                            <button onclick="window.location.reload()" style="margin-top: 16px; padding: 8px 24px; cursor: pointer; border: none; border-radius: 8px; background: #3A9B99; color: white; font-weight: 700; font-family: 'Cairo', sans-serif;">
                                <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة
                            </button>
                        </div>
                    `;
                }
                showToast('عذراً، حدث خطأ أثناء تحميل تفاصيل المادة الصوتية', 'danger');
            }
        }

        function getRandomGradient(str) {
            const gradients = [
                'linear-gradient(135deg, #1A365D 0%, #2A4365 100%)',
                'linear-gradient(135deg, #2C5282 0%, #2B6CB0 100%)',
                'linear-gradient(135deg, #276749 0%, #2F855A 100%)',
                'linear-gradient(135deg, #2F7E7C 0%, #1E5150 100%)',
                'linear-gradient(135deg, #7B341E 0%, #9C4221 100%)',
                'linear-gradient(135deg, #4A1268 0%, #5B2182 100%)',
                'linear-gradient(135deg, #744210 0%, #975A16 100%)',
                'linear-gradient(135deg, #1A202C 0%, #2D3748 100%)'
            ];
            let sum = 0;
            for (let i = 0; i < str.length; i++) {
                sum += str.charCodeAt(i);
            }
            return gradients[sum % gradients.length];
        }

        function renderFullViewer() {
            const container = document.getElementById('mainViewerContent');
            if (!container) return;
            
            // تحديث العنوان الرئيسي في الشريط العلوي
            const pageTitleLabel = document.getElementById('pageTitleLabel');
            if (pageTitleLabel) {
                pageTitleLabel.innerHTML = `<i class="fa-solid fa-microphone-lines"></i> ${activeLecture.title}`;
            }

            let partsListHtml = '';
            if (activeParts.length === 0) {
                partsListHtml = `<p style="color:#718096; font-size:13px; text-align:center; padding:20px;">عذراً، لا تتوفر ملفات صوتية لهذه المادة حالياً.</p>`;
            } else {
                activeParts.forEach((part, index) => {
                    partsListHtml += `
                        <div class="part-row" id="rowPart_${index}">
                            <div class="part-info-block" onclick="window.playPartAtIndex(${index})">
                                <div class="part-row-icon">
                                    <i class="fa-solid fa-play"></i>
                                </div>
                                <div class="part-text-wrapper">
                                    <span class="part-row-title">${part.title}</span>
                                    ${part.subtitle ? `<span class="part-row-subtitle">${part.subtitle}</span>` : ''}
                                    <span class="part-row-meta">
                                        <span><i class="fa-solid fa-hashtag"></i> الجزء ${index + 1}</span>
                                        <span>•</span>
                                        <span><i class="fa-solid fa-sd-card"></i> ${part.size}</span>
                                    </span>
                                </div>
                            </div>
                            <div class="part-actions-block">
                                <button class="action-circle-btn play-trigger" data-index="${index}" title="تشغيل / إيقاف">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                                <button class="action-circle-btn download-trigger" data-url="${part.url}" data-title="${part.title}" title="تحميل مباشر">
                                    <i class="fa-solid fa-download"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            // رسم الواجهة العلوية المتكاملة
            container.innerHTML = `
                <!-- بطاقة تعريف المحاضرة والبيانات -->
                <div class="detail-card">
                    <div class="lecture-title-header">
                        <div class="lecture-header-avatar">
                            <i class="fa-solid fa-microphone-lines"></i>
                        </div>
                        <div class="lecture-header-text">
                            <h2>${activeLecture.title}</h2>
                            <div class="scholar-name">
                                <i class="fa-solid fa-chalkboard-user"></i>
                                <span>الشيخ / الداعية: ${activeLecture.scholar}</span>
                            </div>
                        </div>
                    </div>

                    <div class="meta-grid">
                        <div class="meta-item">
                            <div class="meta-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
                            <div class="meta-text">
                                <span class="meta-label">الشيخ / المحاضر</span>
                                <span class="meta-value">${activeLecture.scholar || 'غير محدد'}</span>
                            </div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-icon"><i class="fa-solid fa-layer-group"></i></div>
                            <div class="meta-text">
                                <span class="meta-label">الأجزاء والمقاطع المتاحة</span>
                                <span class="meta-value">${activeParts.length} أجزاء صوتية</span>
                            </div>
                        </div>
                    </div>

                    <h4 style="font-size:14px; font-weight:800; color:#2D3748; margin-bottom:8px;"><i class="fa-solid fa-scroll" style="color:#3A9B99;"></i> البيان والوصف التفصيلي:</h4>
                    <p class="description-box">
                        ${activeLecture.description}
                    </p>
                </div>

                <!-- قائمة الأجزاء والمقاطع الصوتية -->
                <div class="detail-card">
                    <div class="section-title">
                        <div class="title-text">
                            <i class="fa-solid fa-list-ul"></i>
                            <span>قائمة الملفات والأجزاء المتاحة</span>
                        </div>
                        <span class="count-badge">${activeParts.length} مقاطع</span>
                    </div>
                    <div class="parts-container-list">
                        ${partsListHtml}
                    </div>
                </div>
            `;

            // إظهار المشغل السفلي
            const bottomPlayer = document.getElementById('bottomFixedPlayer');
            if (bottomPlayer) {
                bottomPlayer.style.display = 'flex';
            }

            setupAudioPlayerEngine();
        }

        function setupAudioPlayerEngine() {
            const masterPlayBtn = document.getElementById('masterPlayBtn');
            const masterPlayIcon = document.getElementById('masterPlayIcon');
            const soundWaveBars = document.getElementById('soundWaveBars');
            const progressSlider = document.getElementById('progressSlider');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeMuteBtn = document.getElementById('volumeMuteBtn');
            const volumeIcon = document.getElementById('volumeIcon');
            const currentTrackTitle = document.getElementById('currentTrackTitle');
            const currentScholarName = document.getElementById('currentScholarName');
            const currentPartBadge = document.getElementById('currentPartBadge');
            const playerDownloadBtn = document.getElementById('playerDownloadBtn');

            let playPromise = null;
            let lastVolume = 0.9;

            function updateRowIcons(playing) {
                const activeRow = document.getElementById(`rowPart_${activeIndex}`);
                if (activeRow) {
                    const activePlayBtn = activeRow.querySelector('.play-trigger');
                    if (activePlayBtn) {
                        activePlayBtn.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                    }
                }
            }

            function playAudio() {
                playPromise = audioContext.play();
                if (playPromise !== undefined && playPromise !== null) {
                    playPromise.then(() => {
                        playPromise = null;
                        isPlaying = true;
                        if (masterPlayIcon) masterPlayIcon.className = 'fa-solid fa-pause';
                        if (soundWaveBars) soundWaveBars.classList.add('active');
                        updateRowIcons(true);
                    }).catch(err => {
                        playPromise = null;
                        if (err.name === 'AbortError') return;
                        console.error('Audio play error:', err);
                        const currentTrack = activeParts[activeIndex];
                        if (!audioContext.dataset.fallbackTried && currentTrack && currentTrack.url) {
                            audioContext.dataset.fallbackTried = 'true';
                            audioContext.src = `/api/proxy-audio?url=${encodeURIComponent(currentTrack.url)}`;
                            audioContext.load();
                            audioContext.play().then(() => {
                                isPlaying = true;
                                if (masterPlayIcon) masterPlayIcon.className = 'fa-solid fa-pause';
                                if (soundWaveBars) soundWaveBars.classList.add('active');
                                updateRowIcons(true);
                            }).catch(() => {
                                showToast('تعذر تشغيل الملف الصوتي من المصدر', 'warning');
                            });
                        } else {
                            showToast('خطأ أثناء تشغيل الملف الصوتي', 'warning');
                        }
                    });
                }
            }

            function pauseAudio() {
                if (playPromise) {
                    playPromise.then(() => {
                        audioContext.pause();
                        isPlaying = false;
                        if (masterPlayIcon) masterPlayIcon.className = 'fa-solid fa-play';
                        if (soundWaveBars) soundWaveBars.classList.remove('active');
                        updateRowIcons(false);
                    }).catch(() => {});
                } else {
                    audioContext.pause();
                    isPlaying = false;
                    if (masterPlayIcon) masterPlayIcon.className = 'fa-solid fa-play';
                    if (soundWaveBars) soundWaveBars.classList.remove('active');
                    updateRowIcons(false);
                }
            }

            function loadTrack(index, autoPlay = true) {
                if (index < 0 || index >= activeParts.length) return;
                activeIndex = index;
                const track = activeParts[index];
                
                let safeUrl = (track.url || '').replace(/^http:\/\//i, 'https://');
                audioContext.dataset.fallbackTried = 'false';

                audioContext.onerror = () => {
                    if (!audioContext.dataset.fallbackTried && track.url) {
                        audioContext.dataset.fallbackTried = 'true';
                        console.log('Direct audio failed in view, falling back to proxy:', track.url);
                        audioContext.src = `/api/proxy-audio?url=${encodeURIComponent(track.url)}`;
                        audioContext.load();
                        if (isPlaying) {
                            audioContext.play().catch(() => {});
                        }
                    }
                };
                
                audioContext.src = safeUrl;
                audioContext.load();
                
                if (currentTrackTitle) currentTrackTitle.textContent = track.title;
                if (currentScholarName && activeLecture) currentScholarName.textContent = activeLecture.scholar;
                if (currentPartBadge) currentPartBadge.textContent = `الجزء ${index + 1} من ${activeParts.length}`;
                
                // تحديث حالة النشاط في القائمة
                activeParts.forEach((_, idx) => {
                    const row = document.getElementById(`rowPart_${idx}`);
                    if (row) {
                        row.classList.remove('playing');
                        const playIcon = row.querySelector('.play-trigger');
                        if (playIcon) {
                            playIcon.innerHTML = '<i class="fa-solid fa-play"></i>';
                            playIcon.classList.remove('active-play');
                        }
                    }
                });

                const activeRow = document.getElementById(`rowPart_${index}`);
                if (activeRow) {
                    activeRow.classList.add('playing');
                    const activePlayBtn = activeRow.querySelector('.play-trigger');
                    if (activePlayBtn) {
                        activePlayBtn.innerHTML = autoPlay ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                        activePlayBtn.classList.add('active-play');
                    }
                }

                if (autoPlay) {
                    playAudio();
                } else {
                    pauseAudio();
                }
            }

            // إتاحة تشغيل جزء محدد عاماً
            window.playPartAtIndex = function(index) {
                if (index === activeIndex) {
                    if (isPlaying) {
                        pauseAudio();
                    } else {
                        playAudio();
                    }
                } else {
                    loadTrack(index, true);
                }
            };

            // تهيئة الجزء الأول تلقائياً في الواجهة والمشغل
            if (activeParts.length > 0) {
                loadTrack(0, false);
            }

            // زر التشغيل والإيقاف الرئيسي
            if (masterPlayBtn) {
                masterPlayBtn.addEventListener('click', () => {
                    if (isPlaying) {
                        pauseAudio();
                    } else {
                        playAudio();
                    }
                });
            }

            // زر التنزيل في المشغل السفلي
            if (playerDownloadBtn) {
                playerDownloadBtn.addEventListener('click', () => {
                    const currentTrack = activeParts[activeIndex];
                    if (currentTrack && currentTrack.url) {
                        triggerDirectDownload(currentTrack.url, currentTrack.title);
                    } else {
                        showToast('عذراً، لم يتم العثور على رابط التحميل', 'warning');
                    }
                });
            }

            // تحديث الزمن والتقدم المتطابق بدقة مع المؤشر في RTL
            audioContext.addEventListener('timeupdate', () => {
                if (audioContext.duration) {
                    const pct = (audioContext.currentTime / audioContext.duration) * 100;
                    if (progressSlider) {
                        progressSlider.value = pct;
                        progressSlider.style.background = `linear-gradient(to left, #3A9B99 ${pct}%, #DFD5C4 ${pct}%)`;
                    }
                    if (currentTimeEl) currentTimeEl.textContent = formatTime(audioContext.currentTime);
                }
            });

            audioContext.addEventListener('loadedmetadata', () => {
                if (durationTimeEl) durationTimeEl.textContent = formatTime(audioContext.duration);
            });

            // تغيير الموقع بالمؤشر
            if (progressSlider) {
                progressSlider.addEventListener('input', () => {
                    if (audioContext.duration) {
                        const pct = progressSlider.value;
                        audioContext.currentTime = (pct / 100) * audioContext.duration;
                        progressSlider.style.background = `linear-gradient(to left, #3A9B99 ${pct}%, #DFD5C4 ${pct}%)`;
                    }
                });
            }

            // التحكم بمستوى وكتم الصوت
            if (volumeSlider) {
                volumeSlider.addEventListener('input', () => {
                    const val = parseFloat(volumeSlider.value);
                    audioContext.volume = val;
                    if (val > 0) lastVolume = val;
                    updateVolumeIcon(val);
                });
            }

            if (volumeMuteBtn) {
                volumeMuteBtn.addEventListener('click', () => {
                    if (audioContext.volume > 0) {
                        lastVolume = audioContext.volume;
                        audioContext.volume = 0;
                        if (volumeSlider) volumeSlider.value = 0;
                        updateVolumeIcon(0);
                    } else {
                        audioContext.volume = lastVolume || 0.8;
                        if (volumeSlider) volumeSlider.value = audioContext.volume;
                        updateVolumeIcon(audioContext.volume);
                    }
                });
            }

            function updateVolumeIcon(vol) {
                if (!volumeIcon) return;
                if (vol === 0) {
                    volumeIcon.className = 'fa-solid fa-volume-xmark';
                } else if (vol < 0.5) {
                    volumeIcon.className = 'fa-solid fa-volume-low';
                } else {
                    volumeIcon.className = 'fa-solid fa-volume-high';
                }
            }

            // عند انتهاء الملف، الانتقال تلقائياً للملف التالي
            audioContext.addEventListener('ended', () => {
                if (activeIndex + 1 < activeParts.length) {
                    loadTrack(activeIndex + 1, true);
                    showToast('تم الانتقال تلقائياً للجزء التالي', 'success');
                } else {
                    pauseAudio();
                    showToast('اكتمل الاستماع لجميع الأجزاء المتاحة', 'success');
                }
            });

            // ربط ضغطات قائمة الأجزاء
            document.querySelectorAll('.play-trigger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    if (idx === activeIndex) {
                        if (isPlaying) {
                            pauseAudio();
                        } else {
                            playAudio();
                        }
                    } else {
                        loadTrack(idx, true);
                    }
                });
            });

            document.querySelectorAll('.download-trigger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = btn.dataset.url;
                    const title = btn.dataset.title;
                    triggerDirectDownload(url, title);
                });
            });
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function triggerDirectDownload(url, filename) {
            if (window.downloadFur9anFile) {
                window.downloadFur9anFile(url, `${filename}.mp3`);
            } else {
                showToast('جاري بدء تحميل الملف في مجلد الفرقان...', 'success');
                const cleanFilename = filename.replace(/[\/\\?%*:|"<>\s]+/g, '_') + '.mp3';
                const proxyUrl = `/api/download-file?url=${encodeURIComponent(url)}&filename=${encodeURIComponent('الفرقان - ' + cleanFilename)}`;
                const link = document.createElement('a');
                link.href = proxyUrl;
                link.setAttribute('download', `الفرقان - ${cleanFilename}`);
                document.body.appendChild(link);
                link.click();
                setTimeout(() => { if (document.body.contains(link)) document.body.removeChild(link); }, 2000);
            }
        }
    </script>
</body>
</html>
