<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Base Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#145A64" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0E424B" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#082A30" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#DFB76C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B88628" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Islamic 8-Pointed Star Pattern Unit -->
    <pattern id="islamicArabesque" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- 8-pointed star & interlocking lines -->
      <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.4">
        <polygon points="50,15 61,39 85,50 61,61 50,85 39,61 15,50 39,39" />
        <polygon points="50,22 58,35 78,50 58,65 50,78 42,65 22,50 42,35" />
        <rect x="25" y="25" width="50" height="50" transform="rotate(45 50 50)" />
        <rect x="25" y="25" width="50" height="50" />
        <!-- Corner interlacing -->
        <circle cx="0" cy="0" r="18" />
        <circle cx="100" cy="0" r="18" />
        <circle cx="0" cy="100" r="18" />
        <circle cx="100" cy="100" r="18" />
        <path d="M0,50 L50,0 M50,100 L100,50 M0,50 L50,100 M50,0 L100,50" />
      </g>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Arabesque Overlay -->
  <rect width="800" height="500" fill="url(#islamicArabesque)" />

  <!-- Center Decorative Glow & Arch Rosette -->
  <g transform="translate(400, 250)" opacity="0.35">
    <circle r="160" fill="none" stroke="#FCE0AD" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="140" fill="none" stroke="#DFB76C" stroke-width="1.5" />
    <polygon points="0,-120 35,-35 120,0 35,35 0,120 -35,35 -120,0 -35,-35" fill="none" stroke="#FCE0AD" stroke-width="1.5" />
    <polygon points="0,-120 35,-35 120,0 35,35 0,120 -35,35 -120,0 -35,-35" transform="rotate(45)" fill="none" stroke="#DFB76C" stroke-width="1.5" />
    <circle r="60" fill="none" stroke="#FCE0AD" stroke-width="1" />
  </g>

  <!-- Top and Bottom Islamic Arches -->
  <path d="M0,0 Q400,80 800,0 L800,0 L0,0 Z" fill="#FCE0AD" opacity="0.05" />
  <path d="M0,500 Q400,420 800,500 L800,500 L0,500 Z" fill="#FCE0AD" opacity="0.05" />
</svg>
